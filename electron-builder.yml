appId: gg.kali.app
productName: Kali
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - resources/**/*
  - package.json
win:
  target: nsis
  icon: build/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: Kali
  artifactName: Kali-Setup-${version}.${ext}
# Publishing target is inferred from the git remote in CI (electron-builder --publish always).
