appId: gg.kali.app
productName: Kali
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - resources/**/*
  - package.json
win:
  target: nsis
  icon: build/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # Start Menu shortcut makes it searchable as "Kali"; the assisted installer lets the user pick
  # whether to create the desktop shortcut.
  createStartMenuShortcut: true
  createDesktopShortcut: true
  shortcutName: Kali
  artifactName: Kali-Setup-${version}.${ext}
publish:
  provider: github
  owner: shivy1337
  repo: kali
